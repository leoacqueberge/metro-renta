<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Métro" />
    <meta name="theme-color" content="#000091" />
    <meta
      name="description"
      content="Comptez vos trajets non payés, vos amendes et votre rentabilité."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Métro</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <button
          type="button"
          class="btn-icon btn-icon--profile"
          id="btn-settings"
          aria-label="Profil et réglages"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M12 12.8a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Zm0 1.8c-3.1 0-9 1.55-9 4.6V21h18v-1.8c0-3.05-5.9-4.6-9-4.6Z"
            />
          </svg>
        </button>
      </header>

      <section class="meter" aria-live="polite">
        <div class="meter-row">
          <div class="meter-block">
            <p class="meter-label">Trajets</p>
            <p class="meter-value" id="ride-count">0</p>
          </div>
          <div class="meter-block">
            <p class="meter-label">Économisé</p>
            <p class="meter-value meter-value--money" id="ride-total">0,00&nbsp;€</p>
          </div>
        </div>

        <div class="renta">
          <p class="meter-label">Rentabilité</p>
          <p class="meter-value meter-value--money" id="renta-value">0,00&nbsp;€</p>
        </div>

        <div class="amende">
          <div class="amende-top">
            <p class="meter-label">Amendes</p>
            <p class="amende-rate" id="amende-rate">70,00&nbsp;€ l'amende</p>
          </div>
          <div class="amende-controls">
            <button
              type="button"
              class="btn-step"
              id="btn-fine-minus"
              aria-label="Retirer une amende"
              disabled
            >
              −
            </button>
            <p class="meter-value" id="amende-count">0</p>
            <button
              type="button"
              class="btn-step"
              id="btn-fine-plus"
              aria-label="Ajouter une amende"
            >
              +
            </button>
          </div>
        </div>

        <div class="palier" id="palier">
          <div class="palier-top">
            <p class="palier-label">Prochain seuil</p>
            <p class="palier-target" id="palier-target">70,00&nbsp;€</p>
          </div>
          <div
            class="palier-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="palier-bar"
          >
            <div class="palier-fill" id="palier-fill"></div>
          </div>
          <p class="palier-meta" id="palier-meta">70,00&nbsp;€ avant le prochain seuil</p>
        </div>
      </section>

      <section class="actions">
        <div class="action-bar">
          <button type="button" class="btn-add" id="btn-add" aria-label="Ajouter un trajet">
            <span class="btn-add-plus" aria-hidden="true">+</span>
            <span class="btn-add-copy">
              <span class="btn-add-label">Ajouter un trajet</span>
              <span class="btn-add-meta">
                <span class="btn-add-price" id="btn-add-price">2,55&nbsp;€</span>
                <span class="btn-add-pass" id="btn-add-pass" hidden>Pass Liberté&nbsp;+</span>
              </span>
            </span>
          </button>

          <button
            type="button"
            class="btn-icon btn-icon--undo"
            id="btn-undo"
            aria-label="Annuler"
            disabled
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8Z"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div
      class="sheet-backdrop"
      id="settings-sheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
    >
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 id="settings-title">Réglages</h2>

        <div class="field">
          <span class="field-label">Prix du ticket</span>
          <p class="field-price" id="settings-price">2,55&nbsp;€</p>
          <label class="toggle">
            <input type="checkbox" id="input-pass-liberte" />
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-copy">
              <span class="toggle-title">Pass Liberté&nbsp;+</span>
              <span class="toggle-hint">Ticket à 2,05&nbsp;€ au lieu de 2,55&nbsp;€</span>
            </span>
          </label>
        </div>

        <label class="field">
          <span class="field-label">Montant d'une amende</span>
          <div class="field-input-wrap">
            <input
              id="input-milestone"
              type="number"
              inputmode="decimal"
              min="1"
              step="1"
              value="70"
            />
            <span class="field-suffix">€</span>
          </div>
        </label>

        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="btn-settings-close">
            Fermer
          </button>
          <button type="button" class="btn-primary" id="btn-settings-save">
            Enregistrer
          </button>
        </div>

        <button type="button" class="btn-text-danger" id="btn-reset" disabled>
          Réinitialiser le compteur
        </button>
      </div>
    </div>

    <div
      class="sheet-backdrop"
      id="reset-dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="reset-title"
    >
      <div class="sheet sheet--compact">
        <h2 id="reset-title">Tout effacer&nbsp;?</h2>
        <p class="sheet-copy">
          Trajets, amendes et totaux seront remis à zéro. Les réglages sont conservés.
        </p>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="btn-reset-cancel">Annuler</button>
          <button type="button" class="btn-danger" id="btn-reset-confirm">Effacer</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
