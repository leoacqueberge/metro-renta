<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Métro" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="Comptez vos trajets non payés, vos amendes et votre rentabilité."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Métro</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <button
          type="button"
          class="btn-icon"
          id="btn-settings"
          aria-label="Réglages"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
            />
          </svg>
        </button>
      </header>

      <section class="meter" aria-live="polite">
        <div class="meter-row">
          <div class="meter-block">
            <p class="meter-label">Trajets</p>
            <p class="meter-value" id="ride-count">0</p>
          </div>
          <div class="meter-block">
            <p class="meter-label">Économisé</p>
            <p class="meter-value meter-value--money" id="ride-total">0,00&nbsp;€</p>
          </div>
        </div>

        <div class="renta">
          <p class="meter-label">Rentabilité</p>
          <p class="meter-value meter-value--money" id="renta-value">0,00&nbsp;€</p>
        </div>

        <div class="amende">
          <div class="amende-top">
            <p class="meter-label">Amendes</p>
            <p class="amende-rate" id="amende-rate">70,00&nbsp;€ l'amende</p>
          </div>
          <div class="amende-controls">
            <button
              type="button"
              class="btn-step"
              id="btn-fine-minus"
              aria-label="Retirer une amende"
              disabled
            >
              −
            </button>
            <p class="meter-value" id="amende-count">0</p>
            <button
              type="button"
              class="btn-step"
              id="btn-fine-plus"
              aria-label="Ajouter une amende"
            >
              +
            </button>
          </div>
        </div>

        <div class="palier" id="palier">
          <div class="palier-top">
            <p class="palier-label">Prochain seuil</p>
            <p class="palier-target" id="palier-target">70,00&nbsp;€</p>
          </div>
          <div
            class="palier-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="palier-bar"
          >
            <div class="palier-fill" id="palier-fill"></div>
          </div>
          <p class="palier-meta" id="palier-meta">70,00&nbsp;€ avant le prochain seuil</p>
        </div>
      </section>

      <section class="actions">
        <div class="action-bar">
          <button type="button" class="btn-add" id="btn-add" aria-label="Ajouter un trajet">
            <span class="btn-add-plus" aria-hidden="true">+</span>
            <span class="btn-add-copy">
              <span class="btn-add-label">Ajouter un trajet</span>
              <span class="btn-add-price" id="btn-add-price">2,05&nbsp;€</span>
            </span>
          </button>

          <button
            type="button"
            class="btn-icon btn-icon--undo"
            id="btn-undo"
            aria-label="Annuler"
            disabled
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4Z"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div
      class="sheet-backdrop"
      id="settings-sheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
    >
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 id="settings-title">Réglages</h2>

        <label class="field">
          <span class="field-label">Prix du ticket</span>
          <div class="field-input-wrap">
            <input
              id="input-price"
              type="number"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              value="2.05"
            />
            <span class="field-suffix">€</span>
          </div>
        </label>

        <label class="field">
          <span class="field-label">Montant d'une amende</span>
          <div class="field-input-wrap">
            <input
              id="input-milestone"
              type="number"
              inputmode="decimal"
              min="1"
              step="1"
              value="70"
            />
            <span class="field-suffix">€</span>
          </div>
        </label>

        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="btn-settings-close">
            Fermer
          </button>
          <button type="button" class="btn-primary" id="btn-settings-save">
            Enregistrer
          </button>
        </div>

        <button type="button" class="btn-text-danger" id="btn-reset" disabled>
          Réinitialiser le compteur
        </button>
      </div>
    </div>

    <div
      class="sheet-backdrop"
      id="reset-dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="reset-title"
    >
      <div class="sheet sheet--compact">
        <h2 id="reset-title">Tout effacer&nbsp;?</h2>
        <p class="sheet-copy">Trajets, amendes et totaux seront remis à zéro. Les réglages sont conservés.</p>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" id="btn-reset-cancel">Annuler</button>
          <button type="button" class="btn-danger" id="btn-reset-confirm">Effacer</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
